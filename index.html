<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الإلكتروني الاحترافي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at top center, #0f172a, #020617);
      color: #f8fafc;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 9999px; }

    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 15px 35px -10px rgba(16, 185, 129, 0.2);
    }

    .glow-btn {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
      transition: all 0.3s ease;
    }
    .glow-btn:hover {
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
      transform: scale(1.02);
    }

    .animate-pop {
      animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .neon-card-wrapper {
      position: relative;
      border-radius: 0.75rem;
      padding: 2px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
    }

    .neon-card-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        #10b981,
        #06b6d4,
        #3b82f6,
        #8b5cf6,
        #ec4899,
        #10b981
      );
      animation: rotateNeon 6s linear infinite;
      z-index: 0;
      opacity: 0.75;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .neon-card-wrapper:hover::before {
      opacity: 1;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.8));
      animation-duration: 3s;
    }

    .neon-card-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 0.65rem;
      overflow: hidden;
      background: #090d16;
    }

    @keyframes rotateNeon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen pb-20 antialiased">

  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div>
          <h1 class="font-black text-lg bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">متجرنا الرسمي</h1>
          <p class="text-[10px] text-emerald-400 font-bold">تسوق بأمان - التوصيل لكل العراق 🇮🇶</p>
        </div>
      </div>

      <button onclick="toggleCartModal()" class="relative p-2.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/80 rounded-2xl transition flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping text-emerald-400 text-lg"></i>
        <span class="text-xs font-extrabold text-white hidden sm:inline">السلة</span>
        <span id="cartBadge" class="bg-emerald-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded-full min-w-[20px] text-center">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pt-8 space-y-6">
    <div id="categoriesBar" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterCategory('all')" class="cat-btn active px-5 py-2.5 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 transition flex-shrink-0">
        الكل
      </button>
    </div>

    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div class="col-span-full glass-panel p-16 rounded-3xl text-center text-slate-400 font-medium">
        <i class="fa-solid fa-spinner animate-spin text-2xl text-emerald-400 mb-3 block"></i>
        جاري تحميل المنتجات...
      </div>
    </div>
  </main>

  <div id="productDetailModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-2xl rounded-3xl p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto border border-slate-700/50 animate-pop">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modalProductName" class="font-black text-xl text-white truncate">تفاصيل المنتج</h3>
        <button onclick="closeProductDetailModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div class="neon-card-wrapper h-72">
          <div class="neon-card-content relative">
            <img id="modalMainImg" src="" class="w-full h-full object-contain">
          </div>
        </div>
        
        <div id="modalThumbnails" class="flex gap-2 overflow-x-auto p-1"></div>

        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <span id="modalProductCategory" class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-bold"></span>
            <span id="modalProductPrice" class="text-xl font-black text-emerald-400"></span>
          </div>
          <p id="modalProductDesc" class="text-sm text-slate-300 leading-relaxed bg-slate-900/50 p-4 rounded-xl border border-slate-800/80"></p>
        </div>

        <button id="modalAddToCartBtn" class="glow-btn w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-cart-plus"></i> إضافة إلى السلة
        </button>
      </div>
    </div>
  </div>

  <div id="cartModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-5 max-h-[92vh] overflow-y-auto border border-slate-700/50 animate-pop">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-black text-xl text-white flex items-center gap-2">
          <i class="fa-solid fa-basket-shopping text-emerald-400"></i> سلة المشتريات
        </h3>
        <button onclick="toggleCartModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="cartItemsContainer" class="space-y-3 max-h-56 overflow-y-auto pl-1"></div>

      <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3 pt-3 border-t border-slate-800">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">معلومات التوصيل</h4>

        <div>
          <input type="text" id="custName" required placeholder="الاسم الكامل" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div>
          <input type="tel" id="custPhone" required placeholder="رقم الهاتف (مثال: 07700000000)" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <select id="custGov" onchange="updateShippingFee()" required class="w-full px-3 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            <option value="" disabled selected>اختر المحافظة</option>
            <option value="بغداد">بغداد</option>
            <option value="بابل">بابل</option>
            <option value="البصرة">البصرة</option>
            <option value="أربيل">أربيل</option>
            <option value="النجف الأشرف">النجف الأشرف</option>
            <option value="كربلاء المقدسة">كربلاء المقدسة</option>
            <option value="نينوى">نينوى</option>
            <option value="ذي قار">ذي قار</option>
            <option value="القادسية">القادسية</option>
            <option value="الانبار">الانبار</option>
            <option value="كركوك">كركوك</option>
            <option value="ميسان">ميسان</option>
            <option value="المثنى">المثنى</option>
            <option value="واسط">واسط</option>
            <option value="صلاح الدين">صلاح الدين</option>
            <option value="السليمانية">السليمانية</option>
            <option value="دهوك">دهوك</option>
            <option value="ديالى">ديالى</option>
          </select>

          <input type="text" id="custAddress" required placeholder="المنطقة / تفاصيل العنوان" class="w-full px-3 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 space-y-1.5 text-xs">
          <div class="flex justify-between text-slate-400">
            <span>المجموع الفرعي:</span>
            <span id="subtotalPrice">0 د.ع</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>أجور التوصيل:</span>
            <span id="shippingPrice">0 د.ع</span>
          </div>
          <div class="flex justify-between text-sm font-black text-emerald-400 border-t border-slate-800 pt-1.5 mt-1">
            <span>المجموع الكلي:</span>
            <span id="totalPrice">0 د.ع</span>
          </div>
        </div>

        <button type="submit" id="btnSubmitOrder" class="glow-btn w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> تأكيد وإرسال الطلب
        </button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTh6xSmnRsMidK4LTcsQ9oC2-5E8JqnU",
      authDomain: "mtagr-72d74.firebaseapp.com",
      databaseURL: "https://mtagr-72d74-default-rtdb.firebaseio.com",
      projectId: "mtagr-72d74",
      storageBucket: "mtagr-72d74.firebasestorage.app",
      messagingSenderId: "329077433620",
      appId: "1:329077433620:web:a8cc8b811ffa1c8b304e01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let products = [];
    let cart = [];
    let selectedCategory = 'all';
    let currentShippingFee = 5000;

    const formatIQD = (amount) => new Intl.NumberFormat('ar-IQ').format(amount) + " د.ع";

    document.addEventListener("DOMContentLoaded", () => {
      db.ref('products').limitToLast(20).on('value', (snapshot) => {
        const data = snapshot.val();
        products = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
        renderCategories();
        renderProducts();
      }, (error) => {
        document.getElementById("productsGrid").innerHTML = `<div class="col-span-full glass-panel p-8 text-center text-red-400">تعذر تحميل المنتجات حالياً.</div>`;
      });
    });

    function renderCategories() {
      const bar = document.getElementById("categoriesBar");
      const cats = ['all', ...new Set(products.map(p => p.cat).filter(Boolean))];

      bar.innerHTML = cats.map(c => `
        <button onclick="filterCategory('${c}')" class="cat-btn px-5 py-2.5 rounded-xl text-xs font-bold transition flex-shrink-0 ${selectedCategory === c ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'}">
          ${c === 'all' ? 'الكل' : c}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const filtered = selectedCategory === 'all' ? products : products.filter(p => p.cat === selectedCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full glass-panel p-16 rounded-3xl text-center text-slate-400 font-medium">لا توجد منتجات حالياً.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const coverImg = p.img || (p.imgs ? p.imgs[0] : '');
        const imgsCount = p.imgs ? p.imgs.length : 1;

        return `
          <div class="glass-card rounded-2xl p-3.5 flex flex-col justify-between gap-3 relative group">
            <div onclick="openProductDetailModal('${p.id}')" class="neon-card-wrapper cursor-pointer h-48">
              <div class="neon-card-content relative">
                <img src="${coverImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                <span class="absolute top-2 right-2 bg-slate-950/70 backdrop-blur-md text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-800">
                  ${p.cat || 'عام'}
                </span>
                ${imgsCount > 1 ? `
                  <span class="absolute bottom-2 left-2 bg-slate-950/80 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                    <i class="fa-solid fa-images text-emerald-400"></i> ${imgsCount}
                  </span>
                ` : ''}
              </div>
            </div>

            <div class="space-y-1">
              <h4 onclick="openProductDetailModal('${p.id}')" class="font-bold text-sm text-white truncate cursor-pointer hover:text-emerald-400 transition">${p.name}</h4>
              <p class="text-emerald-400 font-black text-base">${formatIQD(p.price)}</p>
            </div>

            <div class="flex gap-2 pt-1">
              <button onclick="addToCart('${p.id}')" class="glow-btn w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openProductDetailModal(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      document.getElementById("modalProductName").innerText = p.name;
      document.getElementById("modalProductCategory").innerText = p.cat || 'عام';
      document.getElementById("modalProductPrice").innerText = formatIQD(p.price);
      document.getElementById("modalProductDesc").innerText = p.desc || 'لا يوجد وصف تفصيلي لهذا المنتج.';

      const imgs = p.imgs || (p.img ? [p.img] : []);
      const mainImg = document.getElementById("modalMainImg");
      mainImg.src = imgs[0] || '';

      const thumbsContainer = document.getElementById("modalThumbnails");
      thumbsContainer.innerHTML = imgs.map((img) => `
        <div class="neon-card-wrapper cursor-pointer flex-shrink-0 w-14 h-14" onclick="document.getElementById('modalMainImg').src='${img}'">
          <div class="neon-card-content">
            <img src="${img}" class="w-full h-full object-cover">
          </div>
        </div>
      `).join('');

      const btn = document.getElementById("modalAddToCartBtn");
      btn.onclick = () => {
        addToCart(p.id);
        closeProductDetailModal();
      };

      document.getElementById("productDetailModal").classList.remove("hidden");
    }

    function closeProductDetailModal() {
      document.getElementById("productDetailModal").classList.add("hidden");
    }

    function addToCart(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      const exist = cart.find(item => item.id === id);
      if(exist) {
        exist.qty += 1;
      } else {
        cart.push({ id: p.id, name: p.name, price: p.price, img: p.img || (p.imgs ? p.imgs[0] : ''), qty: 1 });
      }

      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById("cartBadge");
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      badge.innerText = totalItems;

      const container = document.getElementById("cartItemsContainer");
      if(cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">السلة فارغة حالياً</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
            <img src="${item.img}" class="w-10 h-10 rounded-lg object-cover flex-shrink-0">
            <div class="flex-1 truncate">
              <h5 class="text-xs font-bold text-white truncate">${item.name}</h5>
              <span class="text-[11px] text-emerald-400 font-bold">${formatIQD(item.price)}</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 px-2 py-1 rounded-lg">
              <button onclick="changeQty('${item.id}', -1)" class="text-slate-400 hover:text-white font-bold text-xs">-</button>
              <span class="text-xs font-black text-white px-1">${item.qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="text-slate-400 hover:text-white font-bold text-xs">+</button>
            </div>
          </div>
        `).join('');
      }

      calculateTotals();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if(!item) return;

      item.qty += delta;
      if(item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateShippingFee() {
      const gov = document.getElementById("custGov").value;
      currentShippingFee = (gov === 'بغداد') ? 4000 : 5000;
      calculateTotals();
    }

    function calculateTotals() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const total = cart.length > 0 ? subtotal + currentShippingFee : 0;

      document.getElementById("subtotalPrice").innerText = formatIQD(subtotal);
      document.getElementById("shippingPrice").innerText = formatIQD(cart.length > 0 ? currentShippingFee : 0);
      document.getElementById("totalPrice").innerText = formatIQD(total);
    }

    function toggleCartModal() {
      document.getElementById("cartModal").classList.toggle("hidden");
    }

    function submitOrder(e) {
      e.preventDefault();
      if(cart.length === 0) return alert("السلة فارغة، يرجى إضافة منتجات أولاً");

      const btn = document.getEl
