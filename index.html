<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر النخبة | للتسوق الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="text-slate-800 antialiased pb-20 md:pb-0">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white font-black text-xl shadow-md">ن</div>
        <div>
          <h1 class="font-extrabold text-lg leading-none">متجر النخبة</h1>
          <span class="text-xs text-emerald-600 font-bold">توصيل لكل المحافظات 🇮🇶</span>
        </div>
      </div>

      <div class="flex-1 max-w-md relative hidden sm:block">
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن منتج..." class="w-full bg-slate-100 border-0 rounded-full py-2 pr-10 pl-4 text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all outline-none">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-slate-400"></i>
      </div>

      <button onclick="toggleCart()" class="relative p-2.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-full transition-colors">
        <i class="fa-solid fa-bag-shopping text-xl"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
      </button>
    </div>
  </header>

  <!-- Categories -->
  <div class="max-w-7xl mx-auto px-4 mt-6">
    <div id="categoryContainer" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
  </div>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 my-6">
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <div class="col-span-full text-center py-12 text-slate-400 font-medium">جاري تحميل المنتجات...</div>
    </div>
  </main>

  <!-- Product Details Modal (نافذة تفاصيل المنتج للزبون) -->
  <div id="productDetailModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col md:flex-row">
      <div class="md:w-1/2 bg-slate-100 p-4 flex flex-col justify-between">
        <div class="relative aspect-square rounded-2xl overflow-hidden bg-white shadow-inner">
          <img id="modalMainImg" class="w-full h-full object-cover transition-all duration-300">
        </div>
        <div id="modalThumbnails" class="flex gap-2 mt-3 overflow-x-auto pb-1"></div>
      </div>
      
      <div class="md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
        <div>
          <div class="flex justify-between items-start gap-2">
            <div>
              <span id="modalCat" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full"></span>
              <h2 id="modalTitle" class="text-xl font-extrabold text-slate-800 mt-2"></h2>
            </div>
            <button onclick="closeProductDetail()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-2xl"></i></button>
          </div>
          <p id="modalPrice" class="text-2xl font-black text-emerald-600 mt-3"></p>
          
          <div class="mt-4 pt-4 border-t border-slate-100">
            <h4 class="text-xs font-bold text-slate-400 mb-1">وصف المنتج والتفاصيل:</h4>
            <p id="modalDesc" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line"></p>
          </div>
        </div>

        <button id="modalAddBtn" class="mt-6 w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
        </button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden transition-opacity">
    <div class="fixed inset-y-0 left-0 w-full max-w-md bg-white shadow-2xl flex flex-col justify-between">
      <div class="p-4 border-b flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-cart-flatbed text-emerald-600 text-lg"></i>
          <h2 class="font-bold text-lg">سلة الشراء</h2>
        </div>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="cartItems" class="flex-1 overflow-y-auto p-4 divide-y"></div>

      <div class="p-4 border-t bg-slate-50 space-y-3">
        <div class="space-y-2 text-sm">
          <div class="flex justify-between text-slate-500"><span>مجموع المنتجات:</span><span id="subtotal">0 د.ع</span></div>
          <div class="flex justify-between text-slate-500"><span>أجور التوصيل:</span><span id="shippingFee">5,000 د.ع</span></div>
          <div class="flex justify-between font-bold text-base text-slate-800 pt-2 border-t"><span>المبلغ الكلي:</span><span id="totalAmount" class="text-emerald-600">0 د.ع</span></div>
        </div>

        <form id="checkoutForm" onsubmit="handleCheckout(event)" class="space-y-2.5 pt-2">
          <input type="text" id="custName" required placeholder="الاسم الكامل" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          <input type="tel" id="custPhone" required pattern="07[3-9][0-9]{8}" placeholder="رقم الهاتف (07xxxxxxxxx)" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          <select id="custGov" onchange="updateShipping()" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            <option value="">اختر المحافظة...</option>
            <option value="بغداد" data-fee="5000">بغداد (5,000 د.ع)</option>
            <option value="البصرة" data-fee="6000">البصرة (6,000 د.ع)</option>
            <option value="أربيل" data-fee="6000">أربيل (6,000 د.ع)</option>
            <option value="النجف الأشرف" data-fee="5000">النجف الأشرف (5,000 د.ع)</option>
            <option value="كربلاء المقدسة" data-fee="5000">كربلاء المقدسة (5,000 د.ع)</option>
            <option value="بابل" data-fee="5000">بابل (5,000 د.ع)</option>
            <option value="بقية المحافظات" data-fee="6000">بقية المحافظات (6,000 د.ع)</option>
          </select>
          <input type="text" id="custAddress" required placeholder="العنوان والدالة" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          
          <button type="submit" id="btnCheckout" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> تأكيد الطلب
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTh6xSmnRsMidK4LTcsQ9oC2-5E8JqnU",
      authDomain: "mtagr-72d74.firebaseapp.com",
      databaseURL: "https://mtagr-72d74-default-rtdb.firebaseio.com",
      projectId: "mtagr-72d74",
      storageBucket: "mtagr-72d74.firebasestorage.app",
      messagingSenderId: "329077433620",
      appId: "1:329077433620:web:a8cc8b811ffa1c8b304e01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let products = [];
    let cart = [];
    let selectedCategory = "الكل";

    const formatIQD = (amount) => new Intl.NumberFormat('ar-IQ').format(amount) + " د.ع";

    document.addEventListener("DOMContentLoaded", () => {
      db.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        products = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        renderCategories();
        renderProducts();
      });
    });

    function renderCategories() {
      const categories = ["الكل", ...new Set(products.map(p => p.cat))];
      const container = document.getElementById("categoryContainer");
      if (!container) return;

      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      if (!grid) return;

      const query = (document.getElementById("searchInput")?.value || "").toLowerCase();
      
      const filtered = products.filter(p => {
        const matchesCat = selectedCategory === "الكل" || p.cat === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">لا توجد منتجات متوفرة.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const mainImg = p.imgs ? p.imgs[0] : p.img;
        return `
          <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
            <div onclick="openProductDetail('${p.id}')" class="relative overflow-hidden aspect-square bg-slate-100 cursor-pointer">
              <img src="${mainImg}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <span class="absolute top-2 right-2 bg-slate-900/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${p.cat}</span>
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between">
              <div onclick="openProductDetail('${p.id}')" class="cursor-pointer">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base line-clamp-2">${p.name}</h3>
                <p class="text-emerald-600 font-extrabold mt-1 text-sm sm:text-base">${formatIQD(p.price)}</p>
              </div>
              <button onclick="addToCart('${p.id}')" class="mt-3 w-full py-2 bg-slate-900 hover:bg-emerald-600 text-white rounded-xl text-xs sm:text-sm font-bold transition-colors flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-plus text-xs"></i> إضافة للسلة
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProducts() { renderProducts(); }

    function openProductDetail(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      const imgs = p.imgs || [p.img];
      
      document.getElementById("modalTitle").innerText = p.name;
      document.getElementById("modalCat").innerText = p.cat;
      document.getElementById("modalPrice").innerText = formatIQD(p.price);
      document.getElementById("modalDesc").innerText = p.desc || "لا يوجد وصف إضافي للمنتج.";
      
      const mainImg = document.getElementById("modalMainImg");
      mainImg.src = imgs[0];

      const thumbs = document.getElementById("modalThumbnails");
      thumbs.innerHTML = imgs.map((img, idx) => `
        <img src="${img}" onclick="setMainModalImage('${img}')" class="w-14 h-14 rounded-lg object-cover cursor-pointer border-2 hover:border-emerald-500 transition-all">
      `).join('');

      document.getElementById("modalAddBtn").onclick = () => { addToCart(p.id); closeProductDetail(); };
      document.getElementById("productDetailModal").classList.remove("hidden");
    }

    function setMainModalImage(src) {
      document.getElementById("modalMainImg").src = src;
    }

    function closeProductDetail() {
      document.getElementById("productDetailModal").classList.add("hidden");
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if(item) { item.qty++; } 
      else {
        const product = products.find(p => p.id === id);
        if(product) cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function toggleCart() { document.getElementById("cartModal").classList.toggle("hidden"); }

    function updateCartUI() {
      document.getElementById("cartCount").innerText = cart.reduce((acc, item) => acc + item.qty, 0);
      const container = document.getElementById("cartItems");
      
      if(cart.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 my-8 text-sm">السلة فارغة حالياً</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <img src="${item.imgs ? item.imgs[0] : item.img}" class="w-12 h-12 rounded-lg object-cover border">
              <div>
                <h4 class="font-bold text-sm text-slate-800 line-clamp-1">${item.name}</h4>
                <p class="text-xs text-emerald-600 font-bold">${formatIQD(item.price)}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
              <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 bg-white rounded text-slate-600 font-bold">-</button>
              <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 bg-white rounded text-slate-600 font-bold">+</button>
            </div>
          </div>
        `).join('');
      }
      updateShipping();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if(item) {
        item.qty += delta;
        if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateShipping() {
      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      const govSelect = document.getElementById("custGov");
      const selectedOption = govSelect ? govSelect.options[govSelect.selectedIndex] : null;
      const shippingFee = selectedOption && selectedOption.dataset.fee ? parseInt(selectedOption.dataset.fee) : 5000;

      document.getElementById("subtotal").innerText = formatIQD(subtotal);
      document.getElementById("shippingFee").innerText = formatIQD(shippingFee);
      document.getElementById("totalAmount").innerText = formatIQD(cart.length > 0 ? subtotal + shippingFee : 0);
    }

    function handleCheckout(e) {
      e.preventDefault();
      if(cart.length === 0) return alert("السلة فارغة!");

      const btn = document.getElementById("btnCheckout");
      btn.disabled = true;
      btn.innerText = "جاري إرسال الطلب...";

      const govSelect = document.getElementById("custGov");
      const shippingFee = parseInt(govSelect.options[govSelect.selectedIndex].dataset.fee || 5000);
      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      const order = {
        id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
        date: new Date().toISOString(),
        customer: {
          name: document.getElementById("custName").value,
          phone: document.getElementById("custPhone").value,
          gov: document.getElementById("custGov").value,
          address: document.getElementById("custAddress").value,
        },
        items: cart,
        subtotal: subtotal,
        shippingFee: shippingFee,
        total: subtotal + shippingFee,
        status: "جديد"
      };

      db.ref('orders').push(order).then(() => {
        alert(`تم تسجيل طلبك بنجاح! رقم الطلب: ${order.id}`);
        cart = [];
        updateCartUI();
        toggleCart();
        document.getElementById("checkoutForm").reset();
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> تأكيد الطلب`;
      }).catch(err => {
        alert("حدث خطأ أثناء الإرسال.");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> تأكيد الطلب`;
      });
    }
  </script>
</body>
</html>
