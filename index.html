<script>
  let products = [];
  let cart = [];
  let selectedCategory = "الكل";

  const formatIQD = (amount) => new Intl.NumberFormat('ar-IQ').format(amount) + " د.ع";

  // تحميل المنتجات عند فتح الصفحة
  document.addEventListener("DOMContentLoaded", () => {
    loadProducts();
    
    // الاستماع لأي تغيير يحدث في لوحة التحكم وتحديث الواجهة فوراً
    window.addEventListener('storage', (e) => {
      if (e.key === 'iq_products') {
        loadProducts();
      }
    });
  });

  function loadProducts() {
    products = JSON.parse(localStorage.getItem('iq_products')) || [];
    renderCategories();
    renderProducts();
  }

  function renderCategories() {
    const categories = ["الكل", ...new Set(products.map(p => p.cat))];
    const container = document.getElementById("categoryContainer");
    if (!container) return;
    
    container.innerHTML = categories.map(cat => `
      <button onclick="setCategory('${cat}')" 
              class="px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
        ${cat}
      </button>
    `).join('');
  }

  function setCategory(cat) {
    selectedCategory = cat;
    renderCategories();
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById("productGrid");
    if (!grid) return;
    
    const searchInput = document.getElementById("searchInput");
    const query = searchInput ? searchInput.value.toLowerCase() : "";
    
    const filtered = products.filter(p => {
      const matchesCat = selectedCategory === "الكل" || p.cat === selectedCategory;
      const matchesSearch = p.name.toLowerCase().includes(query);
      return matchesCat && matchesSearch;
    });

    if(filtered.length === 0) {
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">لا توجد منتجات متوفرة حالياً. أضف منتجات من لوحة التحكم.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
        <div class="relative overflow-hidden aspect-square bg-slate-100">
          <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          <span class="absolute top-2 right-2 bg-slate-900/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${p.cat}</span>
        </div>
        <div class="p-3.5 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-slate-800 text-sm sm:text-base line-clamp-2">${p.name}</h3>
            <p class="text-emerald-600 font-extrabold mt-1 text-sm sm:text-base">${formatIQD(p.price)}</p>
          </div>
          <button onclick="addToCart(${p.id})" class="mt-3 w-full py-2 bg-slate-900 hover:bg-emerald-600 text-white rounded-xl text-xs sm:text-sm font-bold transition-colors flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-plus text-xs"></i> إضـافة للسـلة
          </button>
        </div>
      </div>
    `).join('');
  }

  function filterProducts() { renderProducts(); }

  function addToCart(id) {
    const item = cart.find(i => i.id === id);
    if(item) { item.qty++; } 
    else {
      const product = products.find(p => p.id === id);
      if(product) cart.push({ ...product, qty: 1 });
    }
    updateCartUI();
  }

  function toggleCart() {
    document.getElementById("cartModal").classList.toggle("hidden");
  }

  function updateCartUI() {
    document.getElementById("cartCount").innerText = cart.reduce((acc, item) => acc + item.qty, 0);
    const container = document.getElementById("cartItems");
    
    if(cart.length === 0) {
      container.innerHTML = `<p class="text-center text-slate-400 my-8 text-sm">السلة فارغة حالياً</p>`;
    } else {
      container.innerHTML = cart.map(item => `
        <div class="py-3 flex items-center justify-between gap-2">
          <div class="flex items-center gap-3">
            <img src="${item.img}" class="w-12 h-12 rounded-lg object-cover border">
            <div>
              <h4 class="font-bold text-sm text-slate-800 line-clamp-1">${item.name}</h4>
              <p class="text-xs text-emerald-600 font-bold">${formatIQD(item.price)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1">
            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white rounded shadow-sm text-slate-600 font-bold">-</button>
            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white rounded shadow-sm text-slate-600 font-bold">+</button>
          </div>
        </div>
      `).join('');
    }
    updateShipping();
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if(item) {
      item.qty += delta;
      if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
    }
    updateCartUI();
  }

  function updateShipping() {
    const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
    const govSelect = document.getElementById("custGov");
    const selectedOption = govSelect ? govSelect.options[govSelect.selectedIndex] : null;
    const shippingFee = selectedOption && selectedOption.dataset.fee ? parseInt(selectedOption.dataset.fee) : 5000;

    document.getElementById("subtotal").innerText = formatIQD(subtotal);
    document.getElementById("shippingFee").innerText = formatIQD(shippingFee);
    document.getElementById("totalAmount").innerText = formatIQD(cart.length > 0 ? subtotal + shippingFee : 0);
  }

  function handleCheckout(e) {
    e.preventDefault();
    if(cart.length === 0) return alert("السلة فارغة!");

    const govSelect = document.getElementById("custGov");
    const shippingFee = parseInt(govSelect.options[govSelect.selectedIndex].dataset.fee || 5000);
    const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

    const order = {
      id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
      date: new Date().toISOString(),
      customer: {
        name: document.getElementById("custName").value,
        phone: document.getElementById("custPhone").value,
        gov: document.getElementById("custGov").value,
        address: document.getElementById("custAddress").value,
      },
      items: cart,
      subtotal: subtotal,
      shippingFee: shippingFee,
      total: subtotal + shippingFee,
      status: "جديد"
    };

    let orders = JSON.parse(localStorage.getItem('iq_orders')) || [];
    orders.unshift(order);
    localStorage.setItem('iq_orders', JSON.stringify(orders));

    alert(`تم تسجيل طلبك بنجاح! رقم الطلب: ${order.id}`);
    cart = [];
    updateCartUI();
    toggleCart();
    document.getElementById("checkoutForm").reset();
  }
</script>
