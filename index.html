<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجرنا الرسمي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0b1329;
      color: #f8fafc;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .glass-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
    }

    .cat-btn-inactive {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen pb-20 antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/60">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <button onclick="toggleCartModal()" class="relative p-2.5 bg-slate-900 border border-slate-800 rounded-2xl flex items-center gap-2">
        <span id="cartBadge" class="bg-emerald-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded-full">0</span>
        <i class="fa-solid fa-cart-shopping text-emerald-400 text-lg"></i>
      </button>

      <div class="flex items-center gap-3">
        <div class="text-right">
          <h1 class="font-black text-lg text-white">متجرنا الرسمي</h1>
          <p class="text-[11px] text-emerald-400 font-bold">تسوق بأمان - التوصيل لكل العراق 🇮🇶</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center font-black text-xl text-slate-950 shadow-md">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 pt-6 space-y-5">
    <!-- Categories -->
    <div id="categoriesBar" class="flex gap-2 justify-end overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterCategory('all')" class="cat-btn active px-6 py-2 rounded-xl text-xs font-extrabold bg-emerald-500 text-slate-950">
        الكل
      </button>
    </div>

    <!-- Products Grid -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <div class="col-span-full p-12 text-center text-slate-400 font-medium">
        <i class="fa-solid fa-spinner animate-spin text-2xl text-emerald-400 mb-3 block"></i>
        جاري تحميل المنتجات...
      </div>
    </div>
  </main>

  <!-- Product Detail Modal -->
  <div id="productDetailModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto border border-slate-800">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <button onclick="closeProductDetailModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h3 id="modalProductName" class="font-black text-lg text-white truncate">تفاصيل المنتج</h3>
      </div>

      <div class="space-y-4">
        <div class="h-64 rounded-2xl overflow-hidden bg-slate-900 border border-slate-800">
          <img id="modalMainImg" src="" class="w-full h-full object-contain">
        </div>
        <div id="modalThumbnails" class="flex gap-2 overflow-x-auto"></div>

        <div class="space-y-2 text-right">
          <div class="flex justify-between items-center dir-ltr">
            <span id="modalProductPrice" class="text-xl font-black text-emerald-400"></span>
            <span id="modalProductCategory" class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-bold"></span>
          </div>
          <p id="modalProductDesc" class="text-xs text-slate-300 leading-relaxed bg-slate-900/60 p-3.5 rounded-xl border border-slate-800/80"></p>
        </div>

        <button id="modalAddToCartBtn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-cart-plus"></i> إضافة إلى السلة
        </button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto border border-slate-800">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <button onclick="toggleCartModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h3 class="font-black text-lg text-white flex items-center gap-2">
          سلة المشتريات <i class="fa-solid fa-basket-shopping text-emerald-400"></i>
        </h3>
      </div>

      <div id="cartItemsContainer" class="space-y-2.5 max-h-48 overflow-y-auto"></div>

      <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3 pt-3 border-t border-slate-800">
        <h4 class="text-[11px] font-bold text-slate-400 text-right uppercase">معلومات التوصيل</h4>

        <input type="text" id="custName" required placeholder="الاسم الكامل" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-right">

        <input type="tel" id="custPhone" required placeholder="رقم الهاتف" class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-right">

        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="custAddress" required placeholder="العنوان التفصيلي" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-right">

          <select id="custGov" onchange="updateShippingFee()" required class="w-full px-2 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500 text-right">
            <option value="" disabled selected>المحافظة</option>
            <option value="بغداد">بغداد</option>
            <option value="بابل">بابل</option>
            <option value="البصرة">البصرة</option>
            <option value="أربيل">أربيل</option>
            <option value="النجف الأشرف">النجف الأشرف</option>
            <option value="كربلاء المقدسة">كربلاء المقدسة</option>
            <option value="نينوى">نينوى</option>
            <option value="ذي قار">ذي قار</option>
            <option value="القادسية">القادسية</option>
            <option value="الانبار">الانبار</option>
            <option value="كركوك">كركوك</option>
            <option value="ميسان">ميسان</option>
            <option value="المثنى">المثنى</option>
            <option value="واسط">واسط</option>
            <option value="صلاح الدين">صلاح الدين</option>
            <option value="السليمانية">السليمانية</option>
            <option value="دهوك">دهوك</option>
            <option value="ديالى">ديالى</option>
          </select>
        </div>

        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800/80 space-y-1.5 text-xs">
          <div class="flex justify-between text-slate-400">
            <span id="subtotalPrice">0 د.ع</span>
            <span>المجموع:</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span id="shippingPrice">0 د.ع</span>
            <span>التوصيل:</span>
          </div>
          <div class="flex justify-between font-black text-emerald-400 border-t border-slate-800 pt-1.5 mt-1 text-sm">
            <span id="totalPrice">0 د.ع</span>
            <span>الإجمالي:</span>
          </div>
        </div>

        <button type="submit" id="btnSubmitOrder" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl transition text-xs flex items-center justify-center gap-2">
          تأكيد الطلب <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTh6xSmnRsMidK4LTcsQ9oC2-5E8JqnU",
      authDomain: "mtagr-72d74.firebaseapp.com",
      databaseURL: "https://mtagr-72d74-default-rtdb.firebaseio.com",
      projectId: "mtagr-72d74",
      storageBucket: "mtagr-72d74.firebasestorage.app",
      messagingSenderId: "329077433620",
      appId: "1:329077433620:web:a8cc8b811ffa1c8b304e01"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let products = [];
    let cart = [];
    let selectedCategory = 'all';
    let currentShippingFee = 5000;

    const formatIQD = (amount) => new Intl.NumberFormat('ar-IQ').format(amount) + " د.ع";

    document.addEventListener("DOMContentLoaded", () => {
      db.ref('products').limitToLast(20).on('value', (snapshot) => {
        const data = snapshot.val();
        products = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
        renderCategories();
        renderProducts();
      });
    });

    function renderCategories() {
      const bar = document.getElementById("categoriesBar");
      const cats = ['all', ...new Set(products.map(p => p.cat).filter(Boolean))];

      bar.innerHTML = cats.map(c => `
        <button onclick="filterCategory('${c}')" class="cat-btn px-5 py-2 rounded-xl text-xs font-bold transition flex-shrink-0 ${selectedCategory === c ? 'bg-emerald-500 text-slate-950' : 'cat-btn-inactive'}">
          ${c === 'all' ? 'الكل' : c}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const filtered = selectedCategory === 'all' ? products : products.filter(p => p.cat === selectedCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full glass-panel p-12 rounded-2xl text-center text-slate-400 font-medium">لا توجد منتجات حالياً.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const coverImg = p.img || (p.imgs ? p.imgs[0] : '');

        return `
          <div class="glass-card p-3 flex flex-col justify-between gap-2.5 relative">
            <div onclick="openProductDetailModal('${p.id}')" class="cursor-pointer h-52 rounded-xl overflow-hidden bg-slate-900 border border-slate-800/80 relative">
              <img src="${coverImg}" class="w-full h-full object-contain p-1" loading="lazy">
              <span class="absolute top-2.5 right-2.5 bg-slate-950/80 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-800">
                ${p.cat || 'عام'}
              </span>
            </div>

            <div class="text-right px-1">
              <h4 onclick="openProductDetailModal('${p.id}')" class="font-extrabold text-sm text-white truncate cursor-pointer hover:text-emerald-400 transition">${p.name}</h4>
              <p class="text-emerald-400 font-black text-sm mt-0.5">${formatIQD(p.price)}</p>
            </div>

            <button onclick="addToCart('${p.id}')" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition flex items-center justify-center gap-1.5 mt-1">
              إضافة للسلة <i class="fa-solid fa-cart-plus"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function openProductDetailModal(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      document.getElementById("modalProductName").innerText = p.name;
      document.getElementById("modalProductCategory").innerText = p.cat || 'عام';
      document.getElementById("modalProductPrice").innerText = formatIQD(p.price);
      document.getElementById("modalProductDesc").innerText = p.desc || 'لا يوجد وصف تفصيلي لهذا المنتج.';

      const imgs = p.imgs || (p.img ? [p.img] : []);
      const mainImg = document.getElementById("modalMainImg");
      mainImg.src = imgs[0] || '';

      const thumbsContainer = document.getElementById("modalThumbnails");
      thumbsContainer.innerHTML = imgs.map((img) => `
        <div class="cursor-pointer flex-shrink-0 w-12 h-12 rounded-lg overflow-hidden border border-slate-800" onclick="document.getElementById('modalMainImg').src='${img}'">
          <img src="${img}" class="w-full h-full object-cover">
        </div>
      `).join('');

      const btn = document.getElementById("modalAddToCartBtn");
      btn.onclick = () => {
        addToCart(p.id);
        closeProductDetailModal();
      };

      document.getElementById("productDetailModal").classList.remove("hidden");
    }

    function closeProductDetailModal() {
      document.getElementById("productDetailModal").classList.add("hidden");
    }

    function addToCart(id) {
      const p = products.find(item => item.id === id);
      if(!p) return;

      const exist = cart.find(item => item.id === id);
      if(exist) {
        exist.qty += 1;
      } else {
        cart.push({ id: p.id, name: p.name, price: p.price, img: p.img || (p.imgs ? p.imgs[0] : ''), qty: 1 });
      }

      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById("cartBadge");
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      badge.innerText = totalItems;

      const container = document.getElementById("cartItemsContainer");
      if(cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">السلة فارغة</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between gap-2 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
            <div class="flex items-center gap-2 bg-slate-800 px-2 py-1 rounded-lg">
              <button onclick="changeQty('${item.id}', 1)" class="text-slate-400 hover:text-white font-bold text-xs">+</button>
              <span class="text-xs font-black text-white px-1">${item.qty}</span>
              <button onclick="changeQty('${item.id}', -1)" class="text-slate-400 hover:text-white font-bold text-xs">-</button>
            </div>
            <div class="flex-1 text-right truncate">
              <h5 class="text-xs font-bold text-white truncate">${item.name}</h5>
              <span class="text-[10px] text-emerald-400 font-bold">${formatIQD(item.price)}</span>
            </div>
            <img src="${item.img}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0">
          </div>
        `).join('');
      }

      calculateTotals();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if(!item) return;

      item.qty += delta;
      if(item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateShippingFee() {
      const gov = document.getElementById("custGov").value;
      currentShippingFee = (gov === 'بغداد') ? 4000 : 5000;
      calculateTotals();
    }

    function calculateTotals() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const total = cart.length > 0 ? subtotal + currentShippingFee : 0;

      document.getElementById("subtotalPrice").innerText = formatIQD(subtotal);
      document.getElementById("shippingPrice").innerText = formatIQD(cart.length > 0 ? currentShippingFee : 0);
      document.getElementById("totalPrice").innerText = formatIQD(total);
    }

    function toggleCartModal() {
      document.getElementById("cartModal").classList.toggle("hidden");
    }

    function submitOrder(e) {
      e.preventDefault();
      if(cart.length === 0) return alert("السلة فارغة، يرجى إضافة منتجات أولاً");

      const btn = document.getElementById("btnSubmitOrder");
      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const orderData = {
        id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
        date: new Date().toISOString(),
        customer: {
          name: document.getElementById("custName").value,
          phone: document.getElementById("custPhone").value,
          gov: document.getElementById("custGov").value,
          address: document.getElementById("custAddress").value
        },
        items: cart,
        subtotal: subtotal,
        shippingFee: currentShippingFee,
        total: subtotal + currentShippingFee
      };

      db.ref('orders').push(orderData).then(() => {
        alert("تم إرسال الطلب بنجاح!");
        cart = [];
        updateCartUI();
        toggleCartModal();
        document.getElementById("checkoutForm").reset();
      }).finally(() => {
        btn.disabled = false;
        btn.innerHTML = `تأكيد الطلب <i class="fa-solid fa-paper-plane"></i>`;
      });
    }
  </script>
</body>
</html>
